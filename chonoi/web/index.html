  <script>
    "use strict";
    /*
     * Quán Ăn Chợ Nổi — WebGL / High-Performance Client v2.0
     * Tích hợp PixiJS WebGL + Client-side LERP + Particle System (bọt khí, khói bếp, sao sáng)
     * Procedural Animated Sprites: Cá quẫy đuôi, Cá sấu vẫy sống lưng, Trường con đập chân vịt, Bếp lửa bốc khói

     * Mọi chữ hiển thị ≥ 18px theo quy định chuẩn của Lab.
     */

    const cv = document.getElementById("c");
    const ctx = cv.getContext("2d");
    const FONT = '"Segoe UI","Helvetica Neue",Arial,sans-serif';
    const HUD_MIN = 18;

    const params = new URLSearchParams(location.search);
    const DEMO = params.get("demo");
    const DEMO_MENU = params.has("demo");
    const NO_GUIDE = params.get("guide") === "0"; // ?guide=0: bỏ hội thoại mở đầu + thẻ hướng dẫn lần đầu (bot / bench / test)

    let snap = null, offline = false;
    let uiScreen = DEMO || "menu"; // menu|dayIntro|eveningIntro|dayResult|shop|summary|play
    let paused = DEMO === "pause";
    let highContrast = params.get("contrast") === "1";
    let introSince = performance.now();
    let pauseSupported = null;
    let buttons = []; // {x, y, w, h, id, label}
    let lastFrame = performance.now(), fpsEMA = 60;
    let gameTime = 0; // thời gian chạy cho hiệu ứng động

    // --- Cấu hình màu & tên ---

    };
    const dn = (d) => DISH_NAME[d] || d;

    // --- Demo Data ---
    const DEMO_DATA = {
      day: 1,

      },

        ],

          { id: "T3", pos: [9, 6] }, { id: "T4", pos: [13, 6] }
        ],
        customers: [
          { id: "C1", table_id: "T1", state: "waiting", dish: "ca_loc_nuong_trui", patience_ticks_left: 600, patience_max_ticks: 3600 },
          { id: "C2", table_id: "T3", state: "eating", dish: "goi_bong_sung" }
        ],
        events: [
          { tick: 180, name: "spoiled", data: { item_id: "I12", kind: "ca_linh", location: "stock" } },
          {
            tick: 200, name: "cook_started", data: {
              stove_id: "B1", dish: "goi_bong_sung",
              items: [{ id: "I11", kind: "bong_sung", fresh: 45 }, { id: "I14", kind: "bong_sung", fresh: 62.5 }],
              base_price: 28
            }
          },
          { tick: 220, name: "paid", data: { customer_id: "C1", base_price: 34, price: 34, tip: 6 } },
        ],
        meta: { bounds: { x: [0, 16], z: [0, 10] }, patience_s: 60, reputation_min: 0, reputation_max: 5 },
      },
    };

    // --- Hệ thống Interpolation (LERP) và Particle FX ---
    const lerp = (a, b, t) => a + (b - a) * t;
    const lerpAngle = (a, b, t) => {
      let diff = (b - a) % 360;
      if (diff < -180) diff += 360;
      if (diff > 180) diff -= 360;
      return a + diff * t;
    };

    const lerpState = {
      player: { x: 2, y: 0, vx: 0, vy: 0, angle: 0 },
      fish: new Map(), // id -> {x, y, angle, kind}
      monsters: new Map(), // id -> {x, y, angle}
      screenShake: { x: 0, y: 0, intensity: 0 },
    };

    // Art layer state (định nghĩa sớm: checkEventsForFX có thể chạy trước khối art phía dưới)
    const ART = { ok: undefined, tried: false, app: null, view: null, m: null, g: null, q: null, m_: null, stage: null, events: [], err: "", errCount: 0, quanArt: false, dt: 0.016 };

    const particles = []; // {x, y, vx, vy, size, color, alpha, life, maxLife, type}
    const floaters = [];  // {text, x, y, vy, color, alpha, life, maxLife}

    function addParticle(x, y, vx, vy, size, color, maxLife, type = "bubble") {
      if (particles.length > 250) return;
      particles.push({ x, y, vx, vy, size, color, alpha: 1, life: maxLife, maxLife, type });
    }

    function addFloater(text, x, y, color = "#ffe082") {
      floaters.push({ text, x, y, vy: -1.2, color, alpha: 1, life: 60, maxLife: 60 });
    }

    function triggerShake(intensity = 6) {
      lerpState.screenShake.intensity = Math.max(lerpState.screenShake.intensity, intensity);
    }

    // Bọt khí nổi lên từ bình oxy của Trường con khi lặn
    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 60;
        p.alpha = Math.max(0, p.life / p.maxLife);
        if (p.type === "bubble") {
          p.vx += Math.sin(p.y * 0.1) * 0.05; // lượn sóng
          p.vy -= 0.02; // nổi lên
        } else if (p.type === "steam") {
          p.size += 0.08;
          p.vy -= 0.015;
        }
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i];
        f.y += f.vy;
        f.life -= dt * 60;
        f.alpha = Math.max(0, f.life / f.maxLife);
        if (f.life <= 0) floaters.splice(i, 1);
      }

      if (lerpState.screenShake.intensity > 0.05) {
        const s = lerpState.screenShake.intensity;
        lerpState.screenShake.x = (Math.random() - 0.5) * s * 2;
        lerpState.screenShake.y = (Math.random() - 0.5) * s * 2;
        lerpState.screenShake.intensity *= 0.88;
      } else {
        lerpState.screenShake.x = 0;
        lerpState.screenShake.y = 0;
        lerpState.screenShake.intensity = 0;
      }
    }

    // --- Xử lý sự kiện sim để sinh hiệu ứng FX ---
    let lastProcessedTick = -1;
    function checkEventsForFX(events) {
      if (!events || !events.length) return;
      events.forEach((e) => {
        if (e.tick <= lastProcessedTick) return;
        const d = e.data || {};
        artQueueEvent(e);
        if (e.name === "fish_caught") {
          const name = KIND_NAME[d.kind] || "Cá";
          addFloater("+" + name.toUpperCase() + "!", lerpState.player.x, lerpState.player.y - 1.5, "#80d8ff");
          for (let i = 0; i < 12; i++) {
            const ang = Math.random() * Math.PI * 2, spd = Math.random() * 2 + 1;
            addParticle(lerpState.player.x, lerpState.player.y, Math.cos(ang) * spd, Math.sin(ang) * spd, 4, "#b3e5fc", 35, "sparkle");
          }
        } else if (e.name === "gather") {
          const name = KIND_NAME[d.kind] || "Rau";
          addFloater("+" + name.toUpperCase(), lerpState.player.x, lerpState.player.y - 1.5, "#a7ffeb");
        } else if (e.name === "choke" || (e.name === "faint" && d.cause === "monster")) {
          triggerShake(12);
          addFloater("−1 MÁU!", lerpState.player.x, lerpState.player.y - 2, "#ff5252");
        } else if (e.name === "paid") {
          const p = d.price || d.base_price || 0, tip = d.tip || 0;
          addFloater("+" + (p + tip) + "k 💰", 10, 4, "#ffd700");
        } else if (e.name === "spoiled") {
          addFloater("ƯƠN!", lerpState.player.x, lerpState.player.y - 1.2, "#ff7043");
        }
      });
      lastProcessedTick = events[events.length - 1].tick;
    }

    // ==========================================
    // SFX WebAudio (tổng hợp) + phụ đề T461 / Phase 4
    // ==========================================
    let audioCtx = null;
    let soundOn = true;
    let captionsOn = true;
    let sfxPrimed = false;
    const sfxSeen = new Set();
    const captionLines = []; // {text, until}
    let nearMonsterLatch = false;
    let angryCustLatch = false;

    (function loadSfxPrefs() {
      try {
        const s = localStorage.getItem("chonoi_sfx_sound");
        const c = localStorage.getItem("chonoi_sfx_captions");
        if (s === "0") soundOn = false;
        if (s === "1") soundOn = true;
        if (c === "0") captionsOn = false;
        if (c === "1") captionsOn = true;
      } catch (e) { /* private mode */ }
    })();

    function saveSfxPrefs() {
      try {
        localStorage.setItem("chonoi_sfx_sound", soundOn ? "1" : "0");
        localStorage.setItem("chonoi_sfx_captions", captionsOn ? "1" : "0");
      } catch (e) { /* ignore */ }
    }

    function ensureAudio() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === "suspended") { const rp = audioCtx.resume(); if (rp && rp.catch) rp.catch(() => {}); }
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    function unlockAudio() { ensureAudio(); audInit(); }

    function beep(freq, durSec, type, vol) {
      if (!soundOn) return;
      try {
        const ctx = ensureAudio();
        if (!ctx) return;
        const t0 = ctx.currentTime;
        const dur = Math.min(0.4, Math.max(0.04, durSec || 0.12));
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t0);
        const peak = Math.min(0.1, vol == null ? 0.05 : vol);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      } catch (e) { /* thiếu WebAudio → im lặng */ }
    }

    function pushCaption(line) {
      if (!captionsOn || !line) return;
      const now = performance.now();
      captionLines.push({ text: line, until: now + 1800 });
      while (captionLines.length > 3) captionLines.shift();
    }

    function eventSfxKey(e) {
      const d = e.data || {};
      const id = d.item_id || d.fish_id || d.customer_id || d.order_id || d.node_id || d.upgrade || d.action || "";
      return String(e.tick) + "|" + e.name + "|" + id;
    }

    /** Map event name → {caption, play} */
    const SFX_BY_EVENT = {
      fish_caught: {
        caption: "[♪ tõm] bắt cá",
        play: function () { beep(520, 0.1, "sine", 0.05); beep(780, 0.12, "triangle", 0.04); },
      },
      gather: {
        caption: "[♪ xột] hái rau",
        play: function () { beep(640, 0.1, "square", 0.035); },
      },
      monster_hit: {
        caption: "[♪ rầm] Cá Sấu cắn!",
        play: function () { beep(95, 0.32, "sawtooth", 0.08); },
      },
      spoiled: {
        caption: "[♪ ực] hàng ươn",
        play: function () { beep(170, 0.22, "triangle", 0.05); },
      },
      served: {
        caption: "[♪ chát] phục vụ",
        play: function () { beep(700, 0.1, "square", 0.04); },
      },
      paid: {
        caption: "[♪ leng] tiền vào",
        play: function () { beep(880, 0.08, "sine", 0.05); beep(1175, 0.14, "sine", 0.045); },
      },
      bought: {
        caption: "[♪ keng] mua nâng cấp",
        play: function () { beep(988, 0.16, "sine", 0.055); },
      },
      buy_failed: {
        caption: "[♪ bụp] mua lỗi",
        play: function () { beep(140, 0.2, "sawtooth", 0.05); },
      },
      day_start: {
        caption: "[♪ ting] ngày mới",
        play: function () { beep(523, 0.12, "sine", 0.05); beep(659, 0.16, "sine", 0.04); },
      },
      oxygen_empty: {
        caption: "[♪ ục] hết hơi",
        play: function () { beep(210, 0.28, "sine", 0.05); },
      },
      faint: {
        caption: "[♪ ịch] ngất!",
        play: function () { beep(85, 0.35, "sawtooth", 0.07); },
      },
      customer_left: {
        caption: "[♪ hự] khách bỏ đi",
        play: function () { beep(250, 0.18, "triangle", 0.045); },
      },
      monster_warn: {
        caption: "[♪ ù] thủy quái gần!",
        play: function () { beep(310, 0.14, "square", 0.04); },
      },
      angry_warn: {
        caption: "[♪ hứ] khách sắp giận",
        play: function () { beep(360, 0.12, "square", 0.04); },
      },
    };

    function fireSfxNamed(name, captionOverride) {
      const spec = SFX_BY_EVENT[name];
      if (!spec) return;
      pushCaption(captionOverride || spec.caption);
      if (!paused) spec.play();
    }

    function processSfxFromEvents(events, opts) {
      opts = opts || {};
      if (!events || !events.length) return;
      if (!sfxPrimed && !opts.forcePlay) {
        events.forEach(function (e) { sfxSeen.add(eventSfxKey(e)); });
        sfxPrimed = true;
        return;
      }
      sfxPrimed = true;
      events.forEach(function (e) {
        const key = eventSfxKey(e);
        if (sfxSeen.has(key)) return;
        sfxSeen.add(key);
        if (paused && !opts.forcePlay) return;
        let name = e.name;
        if (name === "choke") name = "monster_hit";
        const spec = SFX_BY_EVENT[name];
        if (!spec) return;
        let cap = spec.caption;
        if (name === "paid") {
          const tip = (e.data && e.data.tip) || 0;
          if (tip > 0) cap = "[♪ leng] tiền + boa " + tip + "k";
        }
        pushCaption(cap);
        if (soundOn && !paused) spec.play();
      });
    }

    function sfxEdgeWarn(nearMonster, angry) {
      if (paused) {
        nearMonsterLatch = !!nearMonster;
        angryCustLatch = !!angry;
        return;
      }
      if (nearMonster && !nearMonsterLatch) {
        nearMonsterLatch = true;
        const key = "warn|monster|" + (snap && snap.tick);
        if (!sfxSeen.has(key)) {
          sfxSeen.add(key);
          fireSfxNamed("monster_warn");
        }
      } else if (!nearMonster) nearMonsterLatch = false;
      if (angry && !angryCustLatch) {
        angryCustLatch = true;
        const key = "warn|angry|" + (snap && snap.tick);
        if (!sfxSeen.has(key)) {
          sfxSeen.add(key);
          fireSfxNamed("angry_warn");
        }
      } else if (!angry) angryCustLatch = false;
    }

    function drawSfxCaptions(w, h) {
      const now = performance.now();
      for (let i = captionLines.length - 1; i >= 0; i--) {
        if (captionLines[i].until <= now) captionLines.splice(i, 1);
      }
      if (!captionsOn || !captionLines.length) return;
      const n = captionLines.length;
      const boxH = 28 + n * 26;
      const boxW = Math.min(520, w - 40);
      const bx = (w - boxW) / 2;
      const by = uiScreen === "play" ? h - 78 - boxH : 64;  // màn chờ: lên trên cho khỏi đè nút
      ctx.save();
      ctx.fillStyle = highContrast ? "rgba(0,0,0,0.92)" : "rgba(8,12,18,0.78)";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(bx, by, boxW, boxH, 8) : ctx.rect(bx, by, boxW, boxH);
      ctx.fill();
      if (highContrast) {
        ctx.strokeStyle = "#ffe600";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      captionLines.forEach(function (line, i) {
        text(line.text, w / 2, by + 26 + i * 26, {
          size: 18, align: "center", bold: true,
          color: highContrast ? "#ffe600" : "#ffe082",
        });
      });
      ctx.restore();
    }

    function drawSfxHudToggles(w, h) {
      // Góc trên phải — không đụng gameplay
      const bw = 118, bh = 36, gap = 8;
      const x1 = w - 16 - bw, y0 = 8;
      const x0 = x1 - bw - gap;
      btn("help", "?", x0 - 44, y0, 36, bh, { size: 20, fill: "#4a148c", stroke: "#ce93d8" });
      btn("toggleSound", soundOn ? "🔊 Âm: BẬT" : "🔇 Âm: TẮT", x0, y0, bw, bh, {
        size: 18,
        fill: soundOn ? "#1b5e20" : "#37474f",
        stroke: soundOn ? "#69f0ae" : "#90a4ae",
      });
      btn("toggleCaptions", captionsOn ? "CC: BẬT" : "CC: TẮT", x1, y0, bw, bh, {
        size: 18,
        fill: captionsOn ? "#0d47a1" : "#37474f",
        stroke: captionsOn ? "#82b1ff" : "#90a4ae",
      });
    }

    function toggleSound() {
      unlockAudio();
      soundOn = !soundOn;
      saveSfxPrefs();
      audCall("setMuted", !soundOn);
      if (soundOn) beep(660, 0.08, "sine", 0.04);
    }

    function toggleCaptions() {
      captionsOn = !captionsOn;
      saveSfxPrefs();
      if (captionsOn) pushCaption("[♪] phụ đề bật");
    }

    // Demo SFX: phát lần lượt event mẫu (phụ đề luôn; âm theo soundOn)
    let sfxDemoTimer = null;
    function startSfxDemo() {
      uiScreen = "play";
      paused = false;
      snap = {
        mode: "gather", tick: 1, time_left_ticks: 9000, hold_capacity: 12, hold: [],
        player: { pos: [20, 12], oxygen_ticks: 900, oxygen_max_ticks: 1800, hp: 3, hp_max: 3, at_surface: false },
        nodes: [], fish: [], monsters: [], events: [],
        meta: { bounds: { x: [0, 100], d: [0, 30] }, dock_pos: [2, 0], dock_radius: 3 },
      };
      sfxPrimed = true;
      sfxSeen.clear();
      captionLines.length = 0;
      const seq = [
        { tick: 10, name: "fish_caught", data: { fish_id: "F1", kind: "ca_loc" } },
        { tick: 20, name: "gather", data: { node_id: "N1", kind: "bong_sung" } },
        { tick: 30, name: "monster_hit", data: { hp: 2 } },
        { tick: 40, name: "spoiled", data: { item_id: "I1", kind: "ca_linh", location: "hold" } },
        { tick: 50, name: "oxygen_empty", data: {} },
        { tick: 60, name: "faint", data: { hp: 0 } },
        { tick: 70, name: "served", data: { table_id: "T1" } },
        { tick: 80, name: "paid", data: { tip: 6, price: 34 } },
        { tick: 90, name: "bought", data: { upgrade: "oxygen", level: 1 } },
        { tick: 100, name: "buy_failed", data: { action: "hp", reason: "funds" } },
        { tick: 110, name: "day_start", data: {} },
        { tick: 120, name: "customer_left", data: { order_id: "C1" } },
        { tick: 130, name: "monster_warn", data: {} },
        { tick: 140, name: "angry_warn", data: {} },
      ];
      let i = 0;
      if (sfxDemoTimer) clearInterval(sfxDemoTimer);
      pushCaption("[♪ demo] chuỗi SFX — M tắt âm, N tắt phụ đề");
      sfxDemoTimer = setInterval(function () {
        if (i >= seq.length) { clearInterval(sfxDemoTimer); sfxDemoTimer = null; pushCaption("[♪ demo] xong"); return; }
        const e = seq[i++];
        // named warns are not real snap events — fire directly
        if (e.name === "monster_warn" || e.name === "angry_warn") {
          const key = eventSfxKey(e);
          if (!sfxSeen.has(key)) { sfxSeen.add(key); fireSfxNamed(e.name); }
        } else {
          processSfxFromEvents([e], { forcePlay: true });
          if (snap) {
            snap.events = (snap.events || []).concat([e]);
            snap.tick = e.tick;
          }
        }
      }, 900);
    }

    // --- Điều khiển & Network (day mode + shop_done/buy từ UI Cursor) ---
    const down = new Set();
    const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
    let queue = [], inflight = false, lastSent = "";
    let pendingPauseEdge = false, pendingShopDone = false, pendingBuy = null;
    let pausePulse = false, pulseShopDone = false, pulseBuy = null;
    let holdSent = null;
    let lastSimPhase = null, userStarted = false;
    let shopFlash = "";

    function isDayMode() { return snap && snap.mode === "day"; }
    function simPhase() { return (snap && (snap.phase || (snap.meta && snap.meta.phase))) || null; }
    function playingLive() { return !DEMO && userStarted && (uiScreen === "play" || uiScreen === "shop") && !paused; }

    function gameplayPhase() {
      if (!snap) return "gather";
      return snap.mode === "day" ? snap.phase : snap.mode;
    }

    function currentInput() {
      const phase = simPhase() || (snap && snap.mode);
      const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
      let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
      if (phase === "quan" && !ART.quanArt) dy = -dy; // cảnh quán nghệ thuật có z hướng xuống màn hình → không đảo
      const body = { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
      // Nút cạnh lên: luôn gửi cả true lẫn false (vắng trường = giữ nguyên ở server → pause kẹt, không resume được).
      if (pauseSupported !== false) body.pause = pausePulse;
      body.shop_done = pulseShopDone;
      if (pulseBuy) body.buy = pulseBuy;
      return body;
    }

    function pushInput() {
      if (DEMO && DEMO !== "pause") return;
      if (!userStarted && !pendingPauseEdge && !pendingShopDone && !pendingBuy) return;
      if (uiScreen === "menu" || uiScreen === "dayIntro" || uiScreen === "eveningIntro" || uiScreen === "dayResult" || uiScreen === "summary") {
        if (!pendingPauseEdge && !pendingShopDone && !pendingBuy) return;
      }
      const s = JSON.stringify(currentInput());
      if (s === lastSent) return;
      lastSent = s;
      queue.push(s);
      flush();
    }

    async function flush() {
      if (inflight) return;
      inflight = true;
      while (queue.length) {
        const body = queue.shift();
        try {
          await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } });
          if (body.indexOf('"pause":true') >= 0) pauseSupported = !!(snap && snap.paused !== undefined);
        } catch (e) { /* poll báo */ }
      }
      inflight = false;
    }

    function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }

    function setScreen(s) {
      uiScreen = s;
      introSince = performance.now();
      buttons = [];
      onScreenEnter(s);
      sendHold(wantHold());  // màn chờ / hội thoại / thẻ hướng dẫn không đốt giờ chơi (server giữ nhịp)
    }

    function sendHold(v) {
      if (DEMO || holdSent === v) return;
      holdSent = v;
      fetch("/input", { method: "POST", body: JSON.stringify({ hold: v }), headers: { "Content-Type": "application/json" } })
        .catch(() => { holdSent = null; });
    }

    // Gửi một cạnh lên (pause / shop_done / buy) rồi nhả sau ~80 ms để lần sau lại có cạnh.
    function pulseThenRelease() {
      pausePulse = pendingPauseEdge; pulseShopDone = pendingShopDone; pulseBuy = pendingBuy;
      lastSent = "";
      pushInput();
      setTimeout(() => {
        pendingPauseEdge = false; pendingShopDone = false; pendingBuy = null;
        pausePulse = false; pulseShopDone = false; pulseBuy = null;
        lastSent = "";
        const body = JSON.stringify(currentInput());
        lastSent = body;
        queue.push(body);
        flush();
      }, 80);
    }

    function togglePause() {
      if (DEMO === "pause") { paused = !paused; return; }
      if (!(uiScreen === "play" || uiScreen === "shop")) return;
      pendingPauseEdge = true;
      paused = !paused;
      pulseThenRelease();
    }

    function goPlay() {
      userStarted = true;
      const ph = simPhase();
      if (ph === "shop") setScreen("shop");
      else setScreen("play");
      lastSent = "";
      down.clear();
      pushInput();
    }

    async function startFromMenu() {
      if (snap && (snap.finished || snap.error)) {  // lượt cũ đã xong (Summary → Menu → Chơi): bắt đầu lượt mới
        try { await fetch("/restart", { method: "POST" }); const r = await fetch("/state", { cache: "no-store" }); snap = await r.json(); } catch (e) { /* poll báo */ }
        lastSimPhase = null;
      }
      const go = () => {
        userStarted = true;
        if (isDayMode() && dayPlan()) setScreen("dayIntro");
        else goPlay();
      };
      if (isDayMode() && !NO_GUIDE && !STORY.skipIntro && !lsGet("chonoi_story_intro")) {
        lsSet("chonoi_story_intro", "1");
        const st = storyData();
        if (st && storyStart(st.intro, go)) return;
      }
      STORY.skipIntro = false;
      go();
    }

    function skipIntroOrAdvance() {
      if (uiScreen === "dayIntro") goPlay();
      else if (uiScreen === "eveningIntro") setScreen("play");
      else if (uiScreen === "dayResult") {
        if (DEMO) setScreen("shop");
        else if (simPhase() === "shop") setScreen("shop");
        else goPlay();
      }
      else if (uiScreen === "summary") setScreen("menu");
    }

    addEventListener("keydown", (e) => {
      const k = keyName(e);
      unlockAudio();
      if (k === "m") { e.preventDefault(); toggleSound(); return; }
      if (k === "n") { e.preventDefault(); toggleCaptions(); return; }
      if (k === "c") { highContrast = !highContrast; e.preventDefault(); return; }
      if (storyActive()) {
        e.preventDefault();
        if (k === "escape") storySkip();
        else if ((k === " " || k === "enter" || k === "e") && !e.repeat) storyAdvance();
        return;
      }
      if (k === "?" || (k === "/" && e.shiftKey)) { e.preventDefault(); tutToggle(); return; }
      if (TUT.active && tutHolding()) {
        e.preventDefault();
        if (k === "escape") tutFinish();
        else if ((k === " " || k === "enter") && !e.repeat) tutNext();
        return;
      }
      if (k === "escape" || k === "p") {
        if (uiScreen === "play" || uiScreen === "shop" || DEMO === "pause") { e.preventDefault(); togglePause(); return; }
      }
      if (paused) {
        if (k === "enter" || k === " ") { e.preventDefault(); togglePause(); }
        return;
      }
      if (uiScreen === "dayIntro" || uiScreen === "eveningIntro" || uiScreen === "dayResult") {
        if (k === "enter" || k === " " || k === "e") { e.preventDefault(); skipIntroOrAdvance(); return; }
      }
      if (uiScreen === "shop" && (k === "enter" || k === "e")) {
        e.preventDefault();
        if (DEMO) setScreen("summary");
        else { pendingShopDone = true; pulseThenRelease(); }
        return;
      }
      if (uiScreen !== "play") return;
      if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
      if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
      else if (k === "e") down.add("interact");
      else if (k === " ") { down.add("catch"); e.preventDefault(); }
      else if (k === "r") {
        // R chỉ chơi lại khi buổi đã kết thúc/lỗi (giữa chừng sẽ xóa tiến độ 5 Ngày vì một cú bấm nhầm)
        if (snap && (snap.finished || snap.error)) { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
      }
      pushInput();
    });

    addEventListener("keyup", (e) => {
      if (uiScreen !== "play" || paused) return;
      const k = keyName(e);
      if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
      else if (k === "e") down.delete("interact");
      else if (k === " ") down.delete("catch");
      pushInput();
    });

    addEventListener("blur", () => { down.clear(); pushInput(); });

    cv.addEventListener("click", (e) => {
      unlockAudio();
      const r = cv.getBoundingClientRect();
      const cx = e.clientX - r.left, cy = e.clientY - r.top;
      const modal = storyActive() || (TUT.active && tutHolding());
      for (let i = buttons.length - 1; i >= 0; i--) {
        const b = buttons[i];
        if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) {
          if (modal && !MODAL_OK.has(b.id)) return;
          onButton(b.id); return;
        }
      }
      if (storyActive()) storyAdvance();
    });

    function onButton(id) {
      if (id === "play") startFromMenu();
      else if (id === "quit") { userStarted = false; setScreen("menu"); }
      else if (id === "resume") { if (paused) togglePause(); }
      else if (id === "toMenu") { userStarted = false; paused = false; setScreen("menu"); down.clear(); }
      else if (id === "skipIntro") skipIntroOrAdvance();
      else if (id === "tutNext") tutNext();
      else if (id === "tutSkip") tutFinish();
      else if (id === "storyNext") storyAdvance();
      else if (id === "storySkip") storySkip();
      else if (id === "help") tutToggle();
      else if (id === "tutorial") { TUT.shown = {}; lsSet(tutKey("dive"), ""); lsSet(tutKey("quan"), ""); STORY.skipIntro = true; startFromMenu(); }
      else if (id === "storyReplay") { const st = storyData(); if (st) storyStart(st.intro); }
      else if (id === "volDown") setMusicVol(AUD.vol - 0.1);
      else if (id === "volUp") setMusicVol(AUD.vol + 0.1);
      else if (id === "shopDone") {
        if (DEMO) setScreen("summary");
        else { pendingShopDone = true; pulseThenRelease(); }
      }
      else if (id === "summaryOk") setScreen("menu");
      else if (id === "buy_oxygen" || id === "buy_hp") {
        if (DEMO) { shopFlash = "Mua demo · không gửi server"; return; }
        pendingBuy = id === "buy_oxygen" ? "oxygen" : "hp";
        pulseThenRelease();
      }
      else if (id === "demoDay") setScreen("dayIntro");
      else if (id === "demoEve") setScreen("eveningIntro");
      else if (id === "demoRes") setScreen("dayResult");
      else if (id === "demoShop") setScreen("shop");
      else if (id === "demoSum") setScreen("summary");
      else if (id === "demoFresh") { location.search = "?demo=fresh"; }
      else if (id === "demoSfx") { location.search = "?demo=sfx"; }
      else if (id === "contrast") highContrast = !highContrast;
      else if (id === "toggleSound") toggleSound();
      else if (id === "toggleCaptions") toggleCaptions();
    }

    async function poll() {
      if (DEMO === "fresh") { applyFreshDemo(); setTimeout(poll, 200); return; }
      if (DEMO === "sfx") { setTimeout(poll, 200); return; }
      if (DEMO && DEMO !== "pause") { setTimeout(poll, 200); return; }
      try {
        const r = await fetch("/state", { cache: "no-store" });
        snap = await r.json();
        offline = false;
        syncPhaseFromSnap();
        if (snap && snap.events) {
          checkEventsForFX(snap.events);
          processSfxFromEvents(snap.events); // lần đầu prime im; event mới mới SFX/phụ đề
        }
      } catch (e) { offline = true; }
      setTimeout(poll, 24);
    }

    let freshSfxDone = false;
    function applyFreshDemo() {
      const q = params.get("mode") === "quan";
      snap = JSON.parse(JSON.stringify(q ? DEMO_DATA.fresh_quan : DEMO_DATA.fresh_snap));
      uiScreen = "play";
      offline = false;
      if (snap && snap.events) {
        checkEventsForFX(snap.events);
        if (!freshSfxDone) {
          freshSfxDone = true;
          sfxPrimed = true;
          processSfxFromEvents(snap.events, { forcePlay: true });
        }
      }
    }

    function syncPhaseFromSnap() {
      if (!snap || DEMO) return;
      if (snap.paused !== undefined) {
        pauseSupported = true;
        paused = !!snap.paused;
      }
      const ev = snap.events || [];
      for (let i = ev.length - 1; i >= 0; i--) {
        if (ev[i].name === "buy_failed") {
          const d = ev[i].data || {};
          shopFlash = "Mua thất bại: " + (d.reason || "—") + (d.action ? " (" + d.action + ")" : "");
          break;
        }
        if (ev[i].name === "bought") {
          const d = ev[i].data || {};
          shopFlash = "Đã mua " + (d.upgrade || "") + " cấp " + (d.level || "") + " · còn " + (d.money !== undefined ? d.money + "k" : "—");
          break;
        }
      }
      if (!userStarted || uiScreen === "menu") {
        lastSimPhase = simPhase();
        if (!userStarted && snap.held === false) sendHold(true);  // tải lại trang giữa chừng: đứng chờ ở Menu
        return;
      }
      const ph = simPhase();
      const daysDone = snap.days_completed, daysMax = (snap.meta && snap.meta.days) || snap.days;
      if (snap.finished && isDayMode() && daysMax && daysDone >= daysMax) {
        if (uiScreen === "play" || uiScreen === "shop" || uiScreen === "dayResult") { setScreen("summary"); loadLeaderboard(); }
      } else if (ph === "shop") {
        if (uiScreen === "play" && lastSimPhase === "quan") setScreen("dayResult");
        else if (uiScreen !== "shop" && uiScreen !== "dayResult" && uiScreen !== "play") setScreen("shop");
        else if (uiScreen === "play") setScreen("shop");
      } else if (ph === "quan") {
        if (lastSimPhase === "gather" && uiScreen === "play" && isDayMode()) setScreen("eveningIntro");
        else if (uiScreen === "shop" || uiScreen === "dayIntro") setScreen("play");
      } else if (ph === "gather") {
        if (lastSimPhase === "shop") setScreen("dayIntro");
        else if (uiScreen === "shop") setScreen("play");
      }
      lastSimPhase = ph;
    }
    let leaderboardData = null;
    function loadLeaderboard() {
      fetch("/leaderboard", { cache: "no-store" }).then((r) => r.json()).then((d) => { leaderboardData = d; }).catch(() => {});
    }
    poll();

    // --- Các hàm tiện ích & Dữ liệu hiển thị ---
    function fit() {
      const dpr = window.devicePixelRatio || 1;
      const w = innerWidth, h = innerHeight;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return [w, h];
    }

    function text(s, x, y, o = {}) {
      const size = Math.max(HUD_MIN, o.size || HUD_MIN);
      ctx.font = (o.bold ? "600 " : "") + size + "px " + FONT;
      ctx.fillStyle = o.color || "#e8eef2";
      ctx.textAlign = o.align || "left";
      ctx.textBaseline = o.base || "alphabetic";
      ctx.fillText(String(s), x, y);
    }

    function panel(x, y, w, h, bg = "rgba(16, 26, 36, 0.85)", stroke = "rgba(142, 202, 230, 0.3)") {
      ctx.save();
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, 12) : ctx.rect(x, y, w, h);
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    function btn(id, label, x, y, w, h, opt = {}) {
      ctx.save();
      ctx.fillStyle = opt.fill || "#1e3a4c";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, 8) : ctx.rect(x, y, w, h);
      ctx.fill();
      ctx.strokeStyle = opt.stroke || "#4fc3f7";
      ctx.lineWidth = 2;
      ctx.stroke();
      text(label, x + w / 2, y + h / 2 + 7, { size: opt.size || 20, align: "center", color: opt.color || "#e1f5fe", bold: true });
      ctx.restore();
      buttons.push({ id, label, x, y, w, h });
    }

    function bar(x, y, w, h, frac, color, label, bgColor = "rgba(0,0,0,0.5)") {
      ctx.save();
      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, 6) : ctx.rect(x, y, w, h);
      ctx.fill();
      const fillW = Math.max(0, Math.min(1, frac)) * w;
      if (fillW > 0) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(x, y, fillW, h, 6) : ctx.rect(x, y, fillW, h);
        ctx.fill();
      }
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.lineWidth = 1;
      ctx.stroke();
      if (label) text(label, x + w / 2, y + h / 2 + 6, { size: 18, align: "center", bold: true });
      ctx.restore();
    }

    function angryBadge(x, y, withLabel) {
      // Phase 4 TV3 (TICKET-04): cảnh báo "khách sắp giận" khi kiên nhẫn < 25%
      // Nền #ff1744, viền trắng 2px, "!" trắng; nhãn ≥ 18px — HC dùng #ffe600 cho dễ đọc.
      ctx.fillStyle = "#ff1744";
      ctx.fillRect(x, y, 26, 24);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, 24, 22);
      ctx.lineWidth = 1;
      text("!", x + 13, y + 19, { size: 18, bold: true, align: "center", color: "#ffffff" });
      if (withLabel) {
        text("khách sắp giận", x + 32, y + 19, {
          size: 18, bold: true, color: highContrast ? "#ffe600" : "#ff1744",
        });
      }
    }

    function fmtTime(ticks) {
      if (ticks === undefined || ticks === null) return "—";
      const s = Math.ceil(ticks / 60);
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }
    function dash(v) { return v === undefined || v === null ? "—" : v; }
    function shortDish(d) { const n = dn(d); return n.length > 18 ? n.slice(0, 16) + "…" : n; }
    function dist2(a, b) { const dx = a[0] - b[0], dy = a[1] - b[1]; return Math.sqrt(dx * dx + dy * dy); }

    const SPOILED_BELOW_DEFAULT = 30;
    function spoiledBelow() { const v = snap && snap.meta && snap.meta.spoiled_below; return typeof v === "number" ? v : SPOILED_BELOW_DEFAULT; }
    function isItemObj(x) { return x !== null && typeof x === "object" && !Array.isArray(x) && (x.kind !== undefined || x.fresh !== undefined); }
    function itemFresh(x) { return isItemObj(x) && typeof x.fresh === "number" && isFinite(x.fresh) ? x.fresh : undefined; }
    function isUsableItem(x) { const f = itemFresh(x); return f === undefined || f >= spoiledBelow(); }
    function freshColor(f) {
      if (f === undefined || f === null) return "#90a4ae";
      if (f >= 60) return "#66bb6a";
      if (f >= spoiledBelow()) return "#ffca28";
      return "#ef5350";
    }
    function freshLabel(f) { return f === undefined || f === null ? "—" : (Math.round(f * 10) / 10).toFixed(1); }

    function asItemList(src) {
      if (!src) return [];
      if (Array.isArray(src)) {
        return src.map((x, i) => isItemObj(x) ? { id: x.id, kind: x.kind, fresh: itemFresh(x) } : { id: "k" + i, kind: x, fresh: undefined });
      }
      if (typeof src === "object") {
        if (Array.isArray(src.items)) return asItemList(src.items);
        const out = [];
        Object.keys(src).forEach((k) => {
          const n = src[k];

      ART[key] = null;
    }

    function artQueueEvent(e) {
      ART.events.push(e);
      if (ART.events.length > 60) ART.events.shift();
    }
    function artTakeEvents() { const ev = ART.events; ART.events = []; return ev; }

    function hash32(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      return h >>> 0;
    }

    function syncMap(map, items, make, upd, layer) {
      const seen = new Set();
      items.forEach((it) => {
        seen.add(it.id);
        let ent = map.get(it.id);
        if (!ent) {
          const api = artSafe(() => make(it), "make");
          if (!api) return;
          ent = { api, x: null, y: null, fx: 1, st: null };
          layer.addChild(api.container);
          map.set(it.id, ent);
        }
        upd(ent, it);
      });
      map.forEach((ent, id) => {
        if (!seen.has(id)) { artSafe(() => ent.api.destroy(), "rm"); map.delete(id); }
      });
    }

    // ------- GATHER -------
    function artGatherScene(w, h, meta) {
      if (!artInit(w, h)) return null;
      const b = meta.bounds || { x: [0, 100], d: [0, 30] };
      const dp = meta.dock_pos || [2, 0];
      const key = [w, h, b.x[1], b.d[1], dp[0]].join("|");
      let g = ART.g;
      if (g && g.key === key) return g;
      artDestroyScene("g");
      if (ART.app.renderer.width !== w || ART.app.renderer.height !== h) ART.app.renderer.resize(w, h);
      const E = ART.m.E, C = ART.m.C;
      g = artSafe(() => {
        const stage = new PIXI.Container();
        const under = E.createUnderwater(PIXI, { width: w, height: h, surfaceY: SURF_Y, pxPerDepth: PXD, depthMax: b.d[1], pxPerX: PXX });
        stage.addChild(under.container);
        let surf = null;
        if (E.createSurface) {
          surf = artSafe(() => E.createSurface(PIXI, { width: w, height: h, surfaceY: SURF_Y, pxPerX: PXX, worldWidth: b.x[1] * PXX + 200, dockX: dp[0] * PXX }), "surface");
          if (surf) stage.addChild(surf.container);
        }
        const ents = new PIXI.Container();
        const layers = { nodes: new PIXI.Container(), fish: new PIXI.Container(), mons: new PIXI.Container(), diver: new PIXI.Container() };
        ["nodes", "fish", "mons", "diver"].forEach((k) => ents.addChild(layers[k]));
        stage.addChild(ents);
        const fx = E.createFX ? artSafe(() => E.createFX(PIXI), "fx") : null;
        if (fx) stage.addChild(fx.container);
        const diver = C.createDiver ? C.createDiver(PIXI, { scale: 0.85 }) : null;
        if (!diver) return null;
        layers.diver.addChild(diver.container);
        return {
          key, stage, under, surf, ents, layers, fx, diver, camX: null, camD: null,
          fish: new Map(), mons: new Map(), nodes: new Map(), nodeMax: {},
          pst: null, pfx: 1, ppos: null, hurtT: 0, catchT: 0, holdLen: null, spoilT: 0, spoilH: null, faint: false,
        };
      }, "gather scene");
      ART.g = g;
      return g;
    }

    const FISH_KINDS = { ca_linh: 1, ca_loc: 1, ca_keo: 1 };

    // Đồng bộ cảnh gather từ snapshot. Trả về hàm chiếu toạ độ sim → màn hình.
    function artGatherFrame(g, dt, w, h, snap, p, meta, dp) {
      const b = meta.bounds || { x: [0, 100], d: [0, 30] };
      const evs = artTakeEvents();
      const tx = p && p.pos ? lerpState.player.x : dp[0];
      const ty = p && p.pos ? lerpState.player.y : 0;
      // camera: bám người chơi, kẹp theo biên thế giới; trượt mượt
      const wantX = Math.max(0, Math.min(b.x[1] * PXX - w + 160, tx * PXX - w * 0.5));
      const wantD = Math.max(0, ty * PXD + SURF_Y - h * 0.5);
      if (g.camX === null) { g.camX = wantX; g.camD = wantD; }
      const k = 1 - Math.pow(0.001, dt || 0.016);
      g.camX += (wantX - g.camX) * Math.min(1, k * 2.2);
      g.camD += (wantD - g.camD) * Math.min(1, k * 2.2);
      g.under.update(dt, g.camX, g.camD);
      if (g.surf) g.surf.update(dt, g.camX, g.camD);
      const SX = (x) => g.under.toScreenX(x * PXX), SY = (d) => g.under.toScreenY(d * PXD);

      // nodes
      syncMap(g.nodes, snap.nodes || [], (n) => ART.m.E.createNode(PIXI, n.kind), (ent, n) => {
        const ready = n.ready !== false && !(n.regrow_ticks > 0);
        g.nodeMax[n.id] = Math.max(g.nodeMax[n.id] || 1, n.regrow_ticks || 1);
        ent.api.setHarvested && ent.api.setHarvested(!ready);
        ent.api.setRegrow && ent.api.setRegrow(ready ? 1 : 1 - (n.regrow_ticks || 0) / g.nodeMax[n.id]);
        const near = p && p.pos && dist2(p.pos, n.pos) <= (meta.interact_radius || 2) && ready;
        ent.api.setHighlight && ent.api.setHighlight(!!near);
        ent.api.update(dt);
        ent.api.container.x = SX(n.pos[0]); ent.api.container.y = SY(n.pos[1]);
      }, g.layers.nodes);

      // cá
      syncMap(g.fish, snap.fish || [], (f) => ART.m.E.createFish(PIXI, FISH_KINDS[f.kind] ? f.kind : "ca_linh"), (ent, f) => {
        if (ent.x === null) { ent.x = f.pos[0]; ent.y = f.pos[1]; }
        const dx = f.pos[0] - ent.x, dy = f.pos[1] - ent.y;
        ent.x += dx * 0.3; ent.y += dy * 0.3;
        const spd = Math.min(3, Math.hypot(dx, dy) * 60 / 3);
        if (Math.abs(dx) > 0.004) ent.fx = dx > 0 ? 1 : -1;
        ent.api.setFacing(ent.fx); ent.api.setSpeed(0.6 + spd);
        ent.api.update(dt);
        ent.api.container.x = SX(ent.x); ent.api.container.y = SY(ent.y);
        ent.api.container.rotation = Math.max(-0.5, Math.min(0.5, Math.atan2(dy, Math.abs(dx) + 0.002) * 0.5)) * ent.fx;
      }, g.layers.fish);

      // thủy quái
      const mons = snap.monsters || [];
      const species = (meta.monsters && meta.monsters.species) || {};
      syncMap(g.mons, mons.filter((m) => m.pos), () => { const c = ART.m.E.createCrocodile(PIXI); c.container.scale.set(0.8); return c; }, (ent, m) => {
        if (ent.x === null) { ent.x = m.pos[0]; ent.y = m.pos[1]; }
        const dx = m.pos[0] - ent.x;
        ent.x += dx * 0.3; ent.y += (m.pos[1] - ent.y) * 0.3;
        if (Math.abs(dx) > 0.003) ent.fx = dx > 0 ? 1 : -1;
        else if (ent.st === null && p && p.pos) ent.fx = p.pos[0] >= m.pos[0] ? 1 : -1;
        const st = m.state || "patrol";
        if (st !== ent.st) { ent.api.setState(st); ent.st = st; }
        const r = m.warn_radius || (species[m.kind] && species[m.kind].detect_radius) || 10;
        ent.api.setWarning(!!(p && p.pos && dist2(p.pos, m.pos) <= r));
        ent.api.setFacing(ent.fx);
        ent.api.update(dt);
        ent.api.container.x = SX(ent.x); ent.api.container.y = SY(ent.y);
      }, g.layers.mons);

      // thợ lặn
      const dv = g.diver;
      if (p && p.pos) {
        const px = SX(tx), py = SY(ty);
        const prev = g.ppos;
        let vx = 0, vy = 0;
        if (Array.isArray(p.vel)) { vx = p.vel[0] || 0; vy = p.vel[1] || 0; }
        else if (prev) { vx = tx - prev[0]; vy = ty - prev[1]; }
        g.ppos = [tx, ty];
        const moving = Math.hypot(vx, vy) > (Array.isArray(p.vel) ? 0.05 : 0.004);
        if (Math.abs(vx) > (Array.isArray(p.vel) ? 0.05 : 0.004)) g.pfx = vx > 0 ? 1 : -1;
        const atSurf = p.at_surface === undefined ? p.pos[1] <= 0.5 : !!p.at_surface;
        evs.forEach((e) => {
          if (e.name === "monster_hit" || e.name === "choke") {
            g.hurtT = 0.7;
            if (g.fx) g.fx.hit(px, py, 0xff5a3a);
          } else if (e.name === "fish_caught") { g.catchT = 0.55; if (g.fx) g.fx.burst(px, py - 20, 14); }
          else if (e.name === "gather") { g.catchT = 0.45; if (g.fx) g.fx.burst(px, py - 20, 10); }
          else if (e.name === "faint") g.faint = true;
          else if (e.name === "day_start" || e.name === "dive") g.faint = false;
          else if (e.name === "spoiled" && g.fx && !g.spoilH) {
            g.spoilH = g.fx.spoiled(px, py - 34, { label: true }); g.spoilT = 2.4;
          }
        });
        const hl = Array.isArray(snap.hold) ? snap.hold.length : (snap.hold_count || 0);
        if (g.holdLen !== null && hl > g.holdLen) g.catchT = Math.max(g.catchT, 0.55);
        g.holdLen = hl;
        g.hurtT = Math.max(0, g.hurtT - dt); g.catchT = Math.max(0, g.catchT - dt);
        if (g.spoilH) {
          g.spoilT -= dt; g.spoilH.setPos(px, py - 34);
          if (g.spoilT <= 0) { g.spoilH.stop(); g.spoilH = null; }
        }
        const fainted = g.faint || (p.hp !== undefined && p.hp <= 0) || (snap.finished && snap.reason === "fainted");
        let st = "idle";
        if (fainted) st = "faint";
        else if (g.hurtT > 0) st = "hurt";
        else if (g.catchT > 0) st = "catch";
        else if (atSurf && !moving) st = "surface";
        else if (moving) st = "swim";
        if (st !== g.pst) { dv.setState(st); g.pst = st; }
        dv.setFacing(g.pfx);
        dv.update(dt);
        dv.container.visible = true;
        dv.container.x = px; dv.container.y = py;
        dv.container.alpha = (p.invuln_ticks > 0 && !fainted) ? (Math.floor(gameTime * 14) % 2 ? 0.55 : 1) : 1;
      } else dv.container.visible = false;
      if (g.fx) g.fx.update(dt);
      return { SX, SY, px: PXD, tx, ty };
    }

    // ------- QUÁN -------
    function artQuanScene(w, h, snap) {
      if (!artInit(w, h)) return null;
      const tables = {}, stoves = {};
      (snap.tables || []).forEach((t) => { tables[t.id] = [t.pos[0], t.pos[1]]; });
      (snap.stoves || []).forEach((s) => { stoves[s.id] = [s.pos[0], s.pos[1]]; });
      const hasT = Object.keys(tables).length, hasS = Object.keys(stoves).length;
      const key = [w, h, JSON.stringify(tables), JSON.stringify(stoves)].join("|");
      let q = ART.q;
      if (q && q.key === key) return q;
      artDestroyScene("q");
      if (ART.app.renderer.width !== w || ART.app.renderer.height !== h) ART.app.renderer.resize(w, h);
      const E = ART.m.E, C = ART.m.C;
      q = artSafe(() => {
        const top = 150, bottom = 60;
        const ppu = Math.max(24, Math.min((w - 40) / 19, (h - top - bottom) / 10.9));
        const opts = { width: w, height: h, pxPerUnit: ppu, originX: (w - 16 * ppu) / 2 + 0.5 * ppu, originY: top + 0.4 * ppu };
        if (hasT) opts.tables = tables;
        if (hasS) opts.stoves = stoves;
        const scene = E.createQuanScene(PIXI, opts);
        const stage = new PIXI.Container();
        stage.addChild(scene.container);
        const sc = ppu / 58;
        const waiter = C.createWaiter(PIXI, { scale: Math.max(0.55, 0.95 * sc * 1.2) });
        scene.actors.addChild(waiter.container);
        const chef = C.createChef(PIXI, { scale: Math.max(0.55, 0.95 * sc * 1.2) });
        scene.actors.addChild(chef.container);
        return {
          key, stage, scene, waiter, chef, ppu, sc, custs: new Map(), pfx: 1, pst: null, ppos: null,
          serveT: 0, burnT: {}, happyT: {}, chefAt: null,
        };
      }, "quan scene");
      ART.q = q;
      return q;
    }

    function custMood(c, meta) {
      if (c.state === "eating") return "eating";
      const pl = patienceLeft(c), pm = patienceMax(c, meta);
      if (pl === undefined || !(pm > 0)) return "calm";
      const f = pl / pm;
      return f < 0.25 ? "angry" : f < 0.5 ? "impatient" : "calm";
    }

    function artQuanFrame(q, dt, w, h, snap, meta) {
      const sc = q.scene, S = (x, z) => sc.toScreen(x, z);
      const evs = artTakeEvents();
      evs.forEach((e) => {
        const d = e.data || {};
        if (e.name === "served") q.serveT = 0.8;
        else if (e.name === "dish_burnt") q.burnT[d.stove_id] = 2.5;
        else if (e.name === "paid") {
          const c = (snap.customers || []).find((x) => x.id === d.customer_id || x.order_id === d.order_id);
          if (c) q.happyT[c.id] = 2.2;
          const t = (snap.tables || []).find((x) => c && x.id === c.table_id);
          if (t) { const s = S(t.pos[0], t.pos[1]); sc.fx.burst(s.x, s.y - q.ppu * 1.3, 12); }
        } else if (e.name === "spoiled") {
          const pp = snap.player && snap.player.pos ? S(snap.player.pos[0], snap.player.pos[1]) : null;
          if (pp && !q.spoil) { q.spoil = sc.fx.spoiled(pp.x, pp.y - 60, { label: true }); q.spoilT = 2.2; }
        } else if (e.name === "customer_left") {
          // khách bỏ đi: tia đỏ ở bàn
        }
      });
      if (q.spoil) { q.spoilT -= dt; if (snap.player && snap.player.pos) { const pp = S(snap.player.pos[0], snap.player.pos[1]); q.spoil.setPos(pp.x, pp.y - 60); } if (q.spoilT <= 0) { q.spoil.stop(); q.spoil = null; } }

      // bàn
      const byTable = {};
      (snap.customers || []).forEach((c) => { byTable[c.table_id] = c; });
      (snap.tables || []).forEach((t) => {
        const c = byTable[t.id];
        sc.setTable(t.id, { dish: !!(c && c.state === "eating"), hl: !!(c && c.state !== "eating" && patienceLeft(c) !== undefined && patienceLeft(c) / patienceMax(c, meta) < 0.25) });
      });
      // bếp
      let anyCook = false, anyBurn = false;
      const burnTicks = meta.burn_s ? meta.burn_s * 60 : (meta.burn_ticks || 0);
      (snap.stoves || []).forEach((s) => {
        q.burnT[s.id] = Math.max(0, (q.burnT[s.id] || 0) - dt);
        let st = s.state === "cooking" ? "cooking" : s.state === "ready" ? "ready" : "idle";
        if (s.state === "ready" && burnTicks && s.ready_ticks > burnTicks * 0.7) st = "burning";
        if (q.burnT[s.id] > 0) st = "burning";
        sc.setStove(s.id, st);
        if (st === "cooking") anyCook = true;
        if (st === "burning") anyBurn = true;
      });
      // đầu bếp: đứng sau dãy bếp
      const stv = snap.stoves || [];
      if (stv.length) {
        const cx = stv.reduce((a, s) => a + s.pos[0], 0) / stv.length;
        const cz = Math.min.apply(null, stv.map((s) => s.pos[1])) - 1.25;
        const cp = S(cx, cz);
        q.chef.container.x = cp.x; q.chef.container.y = cp.y; q.chef.container.zIndex = cz;
        q.chef.container.visible = true;
        const cs = anyBurn ? "burn" : anyCook ? "cook" : "idle";
        if (cs !== q.chefSt) { q.chef.setState(cs); q.chefSt = cs; }
        q.chef.update(dt);
      } else q.chef.container.visible = false;

      // khách
      const ids = [];
      (snap.customers || []).forEach((c) => { if (c.table_id) ids.push(Object.assign({}, c)); });
      syncMap(q.custs, ids, (c) => {
        const cu = ART.m.C.createCustomer(PIXI, { seed: hash32(String(c.id)) % 997, mood: "calm", scale: Math.max(0.55, q.sc * 1.1) });
        q.scene.actors.addChild(cu.container);
        return cu;
      }, (ent, c) => {
        const t = (snap.tables || []).find((x) => x.id === c.table_id);
        if (!t) { ent.api.container.visible = false; return; }
        ent.api.container.visible = true;
        const s = S(t.pos[0], t.pos[1]);
        ent.api.container.x = s.x; ent.api.container.y = s.y - q.ppu * 0.12;
        ent.api.container.zIndex = t.pos[1] - 0.2;
        q.happyT[c.id] = Math.max(0, (q.happyT[c.id] || 0) - dt);
        let m = custMood(c, meta);
        if (q.happyT[c.id] > 0 && m !== "angry") m = "happy";
        if (m !== ent.st) { ent.api.setState(m); ent.st = m; }
        ent.api.update(dt);
      }, q.scene.actors);

      // phục vụ
      const p = snap.player;
      const wv = q.waiter;
      if (p && p.pos) {
        const s = S(lerpState.player.x, lerpState.player.y);
        const prev = q.ppos;
        let vx = 0, vz = 0;
        if (prev) { vx = lerpState.player.x - prev[0]; vz = lerpState.player.y - prev[1]; }
        q.ppos = [lerpState.player.x, lerpState.player.y];
        const moving = Math.hypot(vx, vz) > 0.004;
        if (Math.abs(vx) > 0.004) q.pfx = vx > 0 ? 1 : -1;
        q.serveT = Math.max(0, q.serveT - dt);
        const hand = dishOf(snap.hand);
        let st = hand ? (moving ? "carry" : "carryIdle") : (moving ? "walk" : "idle");
        if (q.serveT > 0 && !hand) st = "serve";
        if (st !== q.pst) { wv.setState(st); q.pst = st; }
        wv.setFacing(q.pfx);
        wv.update(dt);
        wv.container.visible = true;
        wv.container.x = s.x; wv.container.y = s.y;
        wv.container.zIndex = lerpState.player.y;
      } else wv.container.visible = false;
      sc.update(dt);
      return { SX: (x) => S(x, 0).x, SY: (z) => S(0, z).y, S };
    }

    // ------- MENU backdrop -------
    function artMenuFrame(dt, w, h) {
      if (!artInit(w, h)) return false;
      let m = ART.m_;
      const key = w + "x" + h;
      if (!m || m.key !== key) {
        if (m) artSafe(() => m.stage.destroy({ children: true }), "menu destroy");
        if (ART.app.renderer.width !== w || ART.app.renderer.height !== h) ART.app.renderer.resize(w, h);
        m = ART.m_ = artSafe(() => {
          const E = ART.m.E, C = ART.m.C, stage = new PIXI.Container();
          const under = E.createUnderwater(PIXI, { width: w, height: h, surfaceY: SURF_Y, pxPerDepth: PXD, depthMax: 30, pxPerX: PXX });
          stage.addChild(under.container);
          const diver = C.createDiver(PIXI, { scale: 0.9 }); diver.setState("swim");
          stage.addChild(diver.container);
          return { key, stage, under, diver, t: 0 };
        }, "menu scene");
      }
      if (!m) return false;
      m.t += dt;
      m.under.update(dt, 400 + m.t * 40, 420);
      m.diver.update(dt);
      m.diver.container.x = w * 0.5 + Math.sin(m.t * 0.35) * w * 0.28;
      m.diver.container.y = h * 0.37 + Math.sin(m.t * 0.9) * 12;
      m.diver.setFacing(Math.cos(m.t * 0.35) > 0 ? 1 : -1);
      ART.stage = m.stage;
      return true;
    }

    // ==========================================
    // MÀN HÌNH CHƠI GATHER & QUAN
    // ==========================================

    function drawGather(w, h) {
      const meta = (snap && snap.meta) || {};
      const b = meta.bounds || { x: [0, 100], d: [0, 30] };
      const X = b.x[1], D = b.d[1], SKY = 6;
      const top = 118, bottom = 76;
      const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
      const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
      const sx = (x) => ox + x * s, sy = (d) => oy + d * s;

      // --- Art layer (PixiJS): nếu có thì thay toàn bộ phần vẽ cảnh bằng module art ---
      const dpA = meta.dock_pos || [2, 0], dp = dpA, dr = meta.dock_radius || 3;
      let art = null, sxA = null, syA = null;
      const pA = snap.player;
      if (ART.ok !== false) {
        const g = artGatherScene(w, h, meta);
        if (g) {
          if (pA && pA.pos) {
            lerpState.player.x = lerp(lerpState.player.x, pA.pos[0], 0.25);
            lerpState.player.y = lerp(lerpState.player.y, pA.pos[1], 0.25);
          }
          const v = artSafe(() => artGatherFrame(g, ART.dt, w, h, snap, pA, meta, dpA), "gather frame");
          if (v) { art = v; ART.stage = g.stage; ART.drawn = true; sxA = v.SX; syA = v.SY; ART.quanArt = false; }
        }
      }
      if (art) ctx.clearRect(-60, -60, w + 120, h + 120);
      const sxF = art ? sxA : sx, syF = art ? syA : sy, sF = art ? PXD : s;
      UI.sx = sxF; UI.sy = syF; UI.dock = { x: sxF(dp[0]), y: syF(dp[1] || 0) };
      const mons = snap.monsters || (snap.gather && snap.gather.monsters) || [];
      let nearMonster = false;
      if (!art) {
      // Bầu trời buổi sáng
      const skyGrad = ctx.createLinearGradient(0, top, 0, oy);
      skyGrad.addColorStop(0, "#81d4fa");
      skyGrad.addColorStop(1, "#e1f5fe");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, top, w, SKY * s);

      // Sông nước phù sa & độ sâu sâu thẳm
      const riverGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
      riverGrad.addColorStop(0, "#29b6f6");
      riverGrad.addColorStop(0.3, "#0288d1");
      riverGrad.addColorStop(1, "#011f38");
      ctx.fillStyle = riverGrad;
      ctx.fillRect(sx(0), oy, X * s, D * s);

      // Tia sáng mặt trời xuyên nước (Sun rays / Caustics)
      ctx.save();
      for (let i = 0; i < 6; i++) {
        const rx = sx(15 + i * 16) + Math.sin(gameTime * 0.8 + i) * 20;
        const rayGrad = ctx.createLinearGradient(rx, oy, rx + 40, sy(D));
        rayGrad.addColorStop(0, "rgba(255,255,255,0.12)");
        rayGrad.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(rx - 10, oy);
        ctx.lineTo(rx + 10, oy);
        ctx.lineTo(rx + 70, sy(D));
        ctx.lineTo(rx + 30, sy(D));
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Mặt nước dập dềnh sóng nhẹ
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let x = sx(0); x <= sx(X); x += 6) {
        const wy = oy + Math.sin((x * 0.04) + gameTime * 3) * 2.5;
        if (x === sx(0)) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
      }
      ctx.stroke();

      // Bến tàu & Chiếc xuồng ba lá
      ctx.fillStyle = "rgba(255, 238, 88, 0.15)";
      ctx.beginPath();
      ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2);
      ctx.fill();

      // Xuồng ba lá đỗ ở bến
      const boatBob = Math.sin(gameTime * 2) * 2;
      ctx.fillStyle = "#8d6e63";
      ctx.beginPath();
      ctx.ellipse(sx(dp[0]), sy(-0.8) + boatBob, 2.2 * s, 0.6 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#5d4037"; ctx.stroke();
      text("Bến Ghe", sx(dp[0]), sy(-2.4), { size: 18, align: "center", bold: true, color: "#3e2723" });

      // Thực vật thủy sinh (Nodes: Bông súng, Điên điển, Kèo nèo)
      (snap.nodes || []).forEach((n) => {
        const ready = n.ready !== false && !(n.regrow_ticks > 0);
        const nx = sx(n.pos[0]), ny = sy(n.pos[1]) + Math.sin(gameTime * 2 + n.pos[0]) * 1.5;
        ctx.save();
        ctx.fillStyle = kc(n.kind);
        ctx.beginPath();
        // Vẽ đóa hoa sen / bông súng
        ctx.arc(nx, ny, 0.8 * s, 0, Math.PI * 2);
        ctx.fill();
        if (ready) {
          // Hào quang sẵn sàng thu hoạch
          ctx.strokeStyle = "#fff59d";
          ctx.lineWidth = 3;
          ctx.stroke();
          text("✨", nx, ny - 0.9 * s, { size: 18, align: "center" });
        } else {
          text((n.regrow_ticks !== undefined ? Math.ceil(n.regrow_ticks / 60) + "s" : "—"), nx, ny + 1.2 * s, { size: 18, align: "center", color: "#ffcc80" });
        }
        ctx.restore();
      });

      // Đàn cá bơi lội mềm mại
      (snap.fish || []).forEach((f) => {
        const fx = sx(f.pos[0]), fy = sy(f.pos[1]);
        drawAnimatedFish(fx, fy, f, s);
      });

      // Thủy quái (Cá sấu)
      mons.forEach((m) => {
        if (!m.pos) return;
        drawAnimatedMonster(sx(m.pos[0]), sy(m.pos[1]), m, s);
      });

      } // end !art (cảnh canvas 2D dự phòng)

      // Nhân vật Trường con (Dùng LERP vị trí mượt mà)
      const p = snap.player;
      let nearDock = false, nearNode = false;
      if (p && p.pos) {
        // LERP toạ độ hiển thị
        if (!art) {
          lerpState.player.x = lerp(lerpState.player.x, p.pos[0], 0.25);
          lerpState.player.y = lerp(lerpState.player.y, p.pos[1], 0.25);
        }

        const px = sxF(lerpState.player.x), py = syF(lerpState.player.y);
        UI.px = { x: px, y: py };
        const isUnderwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;

        // Vòng bán kính bắt cá khi lặn
        if (meta.catch_radius && isUnderwater) {
          ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(px, py, meta.catch_radius * sF, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (!art) drawPlayerFallback(px, py, "gather", s, p);

        nearDock = dist2(p.pos, dp) <= dr + 0.05;
        const ir = meta.interact_radius || 2;
        (snap.nodes || []).forEach((n) => { if (n.ready !== false && dist2(p.pos, n.pos) <= ir) nearNode = true; });
        const species = (meta.monsters && meta.monsters.species) || {};
        mons.forEach((m) => {
          const r = m.warn_radius || (species[m.kind] && species[m.kind].detect_radius) || 10;
          if (m.pos && dist2(p.pos, m.pos) <= r) nearMonster = true;
        });
      }

      // Vẽ các hạt bọt khí & tia lấp lánh trong nước
      particles.forEach((pt) => {
        ctx.save();
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.alpha;
        ctx.beginPath();
        ctx.arc(sxF(pt.x), syF(pt.y), pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Vẽ chữ nổi kinh tế/sự kiện
      floaters.forEach((fl) => {
        ctx.save();
        ctx.globalAlpha = fl.alpha;
        text(fl.text, sxF(fl.x), syF(fl.y), { size: 20, align: "center", bold: true, color: fl.color });
        ctx.restore();
      });

      // Viền cảnh báo Thủy quái gần
      sfxEdgeWarn(nearMonster, false);
      if (nearMonster) {
        ctx.strokeStyle = highContrast ? "#ffe600" : "rgba(244, 67, 54, 0.85)";
        ctx.lineWidth = 8;
        ctx.strokeRect(4, 4, w - 8, h - 8);
        alertBanner(w, art ? 176 : h * 0.42, "⚠ Thủy quái gần!");
      }

      // --- HUD BUỔI SÁNG (Chữ rõ ràng ≥ 18px) ---
      if (art) {  // nền tối mờ sau HUD để chữ sáng vẫn đọc được trên trời/nước nông
        const hg = ctx.createLinearGradient(0, 0, 0, 124);
        hg.addColorStop(0, highContrast ? "rgba(0,0,0,0.95)" : "rgba(6,16,28,0.78)");
        hg.addColorStop(1, "rgba(6,16,28,0.35)");
        ctx.fillStyle = hg; ctx.fillRect(0, 0, w, 124);
        const bg2 = ctx.createLinearGradient(0, h - 84, 0, h);
        bg2.addColorStop(0, "rgba(6,16,28,0.3)"); bg2.addColorStop(1, "rgba(6,16,28,0.8)");
        ctx.fillStyle = bg2; ctx.fillRect(0, h - 84, w, 84);
      }
      const tLeft = snap.time_left_ticks;
      const tUrgent = tLeft !== undefined && tLeft <= 30 * 60;
      text("⏱ " + fmtTime(tLeft), 16, 32, { size: 24, bold: true, color: tUrgent ? "#ff5252" : "#e0f2fe" });

      if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
        const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
        bar(130, 14, 210, 22, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7");
        text("Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s", 130, 56, { size: 18, color: low ? "#ff8a80" : "#b3e5fc", bold: true });
        if (p.oxygen_ticks === 0) alertBanner(w, 96, "⚠ Hết hơi!");
        else if (low) alertBanner(w, 96, "⚠ Oxy sắp hết!");
      } else text("Oxy —", 130, 56, { size: 18, color: "#78909c" });

      if (p && p.hp !== undefined && p.hp_max) {
        let hs = ""; for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥ " : "♡ ";
        text("Máu: " + hs, 360, 32, { size: 22, color: "#ff5252", bold: true });
      }

      const depth = p && p.pos ? p.pos[1].toFixed(1) + " m" : "—";
      text("Độ sâu: " + depth, 520, 32, { size: 18, color: "#81d4fa" });

      const surf = p && p.at_surface !== undefined ? (p.at_surface ? "Mặt nước" : "Dưới nước") : "";
      if (surf) text(surf, 520, 56, { size: 18, color: "#cfd8dc" });  // không đặt sát góc phải: nút ?/Âm/CC nằm đó

      if (p && p.catch_cd_ticks !== undefined) {
        if (p.catch_cd_ticks > 0) text("Hồi bắt: " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 660, 32, { size: 18, color: "#90caf9" });
        else text("Hồi bắt: SẴN SÀNG", 660, 32, { size: 18, color: "#69f0ae", bold: true });
      }

      // Danh sách cần lấy theo kế hoạch (không đếm hàng ươn)
      const plan = dayPlan();
      const countsAll = holdCounts(false);
      const countsOk = holdCounts(true);
      const holdLine = Object.keys(countsAll).length
        ? Object.keys(countsAll).map((k) => {
          const spoiled = (countsAll[k] || 0) - (countsOk[k] || 0);
          return (KIND_NAME[k] || k) + "×" + (countsOk[k] || 0) + (spoiled ? "(ươn×" + spoiled + ")" : "");
        }).join("  ")
        : "(trống)";
      text("Giỏ " + holdLine, 150, 80, { size: 18, color: "#cfd8dc" });
      if (plan && plan.need) {
        const parts = Object.keys(plan.need).map((k) => (KIND_NAME[k] || k) + " " + (countsOk[k] || 0) + "/" + plan.need[k]);
        text("Cần lấy: " + parts.join(" · "), 16, 106, { size: 18, color: "#ffd54f", bold: true });
      } else text("Cần lấy: —", 16, 106, { size: 18, color: "#90a4ae" });
      UI.r.need = { x: 8, y: 86, w: Math.min(w - 16, 560), h: 28 };
      UI.r.oxy = { x: 122, y: 6, w: 236, h: 58 };
      const gev = lastHudEvent(GATHER_HUD_EVENTS);
      if (gev) text(hudEventLine(gev), w - 16, 74, { size: 18, align: "right", color: "#ffe082" });

      if (nearDock) text("💡 Nhấn E: Cập bến giao hàng", w / 2, h - 86, { size: 22, align: "center", color: "#ffe082", bold: true });
      else if (nearNode && p && (p.at_surface !== false)) text("💡 Nhấn E: Hái nút rau", w / 2, h - 86, { size: 22, align: "center", color: "#b9f6ca", bold: true });

      // Khay giỏ chứa đồ với độ tươi
      const items = holdItems();
      const cap = snap.hold_capacity || 12;
      const sz = Math.min(46, Math.max(38, (w - 280) / cap - 4)), y0 = h - bottom + 6;
      UI.r.tray = { x: 10, y: y0 - 4, w: cap * (sz + 5) + 6, h: sz + 8 };
      for (let i = 0; i < cap; i++) {
        const x0 = 16 + i * (sz + 5);
        drawFreshSlot(x0, y0, sz, items[i], i === items.length - 1 && items.length > 0);
      }
      if (items.length >= cap) text("GIỎ ĐÃ ĐẦY!", 16 + cap * (sz + 5) + 10, y0 + sz * 0.6, { size: 18, color: "#ffd54f", bold: true });

      text("Phím: WASD bơi · Space bắt cá · E hái/bến · ? hướng dẫn · Esc tạm dừng", w - 16, h - 18, { size: 18, align: "right", color: "#90a4ae" });
    }

    function drawQuan(w, h) {
      const meta = (snap && snap.meta) || {};
      const b = meta.bounds || { x: [0, 16], z: [0, 10] };
      const X = b.x[1], Z = b.z[1], top = 130, bottom = 60;
      const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
      const ox = (w - s * X) / 2, oy = top;
      const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

      let art = null;
      if (ART.ok !== false) {
        const q = artQuanScene(w, h, snap);
        if (q) {
          const pq = snap.player;
          if (pq && pq.pos) {
            lerpState.player.x = lerp(lerpState.player.x, pq.pos[0], 0.28);
            lerpState.player.y = lerp(lerpState.player.y, pq.pos[1], 0.28);
          }
          const v = artSafe(() => artQuanFrame(q, ART.dt, w, h, snap, meta), "quan frame");
          if (v) { art = v; ART.stage = q.stage; ART.drawn = true; ART.quanArt = true; }
        }
      }
      if (art) ctx.clearRect(-60, -60, w + 120, h + 120);
      const sxF = art ? art.SX : sx, syF = art ? art.SY : sy;
      UI.S = art ? art.S : (x, z) => ({ x: sx(x), y: sy(z) });
      const byTable = {};
      (snap.customers || []).forEach((c) => { byTable[c.table_id] = c; });
      if (art) {
        // lớp chữ/biểu tượng đè lên cảnh art (giữ nhãn ≥18px, thanh kiên nhẫn, badge giận)
        (snap.stoves || []).forEach((st) => {
          const bx = art.S(st.pos[0], st.pos[1]);
          if (st.state === "cooking" && st.cook_ticks_left !== undefined)
            text(Math.ceil(st.cook_ticks_left / 60) + "s", bx.x, bx.y + ART.q.ppu * 1.15, { size: 18, align: "center", bold: true, color: "#ffe082" });
          else if (st.state === "ready") text("CHÍN ✨", bx.x, bx.y + ART.q.ppu * 1.15, { size: 18, align: "center", bold: true, color: "#69f0ae" });
        });
        (snap.tables || []).forEach((tb) => {
          const c = byTable[tb.id];
          if (!c) return;
          const bx = art.S(tb.pos[0], tb.pos[1]);
          const cy = bx.y - ART.q.ppu * 2.45;
          const cd = dishOf(c);
          // Bóng thoại vừa khít chữ, neo lệch phải bàn: không đè biển hiệu và không che chỗ đứng mặc định của người phục vụ (bên trái bàn).
          const bl = bx.x - 16;
          if (cd) {
            ctx.save();
            ctx.font = "18px " + FONT;
            const tw2 = Math.ceil(ctx.measureText(shortDish(cd)).width) + 16;
            ctx.restore();
            ctx.fillStyle = "rgba(0,0,0,0.75)";
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(bl, cy - 30, tw2, 30, 6) : ctx.rect(bl, cy - 30, tw2, 30);
            ctx.fill();
            text(shortDish(cd), bl + 8, cy - 8, { size: 18, color: "#ffe082" });
          }
          const pl = patienceLeft(c), pm = patienceMax(c, meta);
          if (pl !== undefined && pm > 0 && c.state !== "eating") {
            const frac = pl / pm, low = frac < 0.25;
            bar(bl, cy + 2, 90, 8, frac, low ? "#ff1744" : "#ffca28");
            if (low) {
              ctx.fillStyle = highContrast ? "#000" : "rgba(0,0,0,0.82)";
              ctx.fillRect(bl + 96, cy + 2 - 14, 196, 32);
              angryBadge(bl + 100, cy + 2 - 10, true);
            }
          }
        });
      }
      if (!art) {
      // Sàn thuyền gỗ của Quán Ăn Chợ Nổi
      ctx.save();
      ctx.fillStyle = "#8d6e63";
      ctx.fillRect(sx(0), sy(Z), X * s, Z * s);

      // Vân gỗ lát sàn thuyền
      ctx.strokeStyle = "rgba(0,0,0,0.15)";
      ctx.lineWidth = 2;
      for (let z = 1; z < Z; z++) {
        ctx.beginPath();
        ctx.moveTo(sx(0), sy(z));
        ctx.lineTo(sx(X), sy(z));
        ctx.stroke();
      }
      ctx.strokeStyle = "#4e342e";
      ctx.lineWidth = 5;
      ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
      ctx.restore();

      // Đèn lồng đỏ lung linh góc quán
      const lanternGlow = Math.sin(gameTime * 3) * 0.15 + 0.85;
      ctx.fillStyle = `rgba(255, 112, 67, ${0.2 * lanternGlow})`;
      ctx.beginPath();
      ctx.arc(sx(2), sy(Z - 1), 2.5 * s, 0, Math.PI * 2);
      ctx.fill();

      // Bếp nấu B1, B2
      (snap.stoves || []).forEach((st) => {
        drawAnimatedStove(sx(st.pos[0]), sy(st.pos[1]), st, s);
      });

      // Bàn ăn và khách hàng
      (snap.tables || []).forEach((tb) => {
        const c = byTable[tb.id];
        drawAnimatedTable(sx(tb.pos[0]), sy(tb.pos[1]), tb, c, meta, s);
      });

      // Nhân vật Trường con bồi bàn
      const p = snap.player;
      if (p && p.pos) {
        lerpState.player.x = lerp(lerpState.player.x, p.pos[0], 0.28);
        lerpState.player.y = lerp(lerpState.player.y, p.pos[1], 0.28);
        const px = sx(lerpState.player.x), py = sy(lerpState.player.y);
        drawPlayerFallback(px, py, "quan", s, p, snap.hand);
      }

      } // end !art
      // Hạt hơi nước bốc lên từ bếp
      particles.forEach((pt) => {
        ctx.save();
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.alpha;
        ctx.beginPath();
        ctx.arc(sxF(pt.x), syF(pt.y), pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Chữ số doanh thu nổi
      floaters.forEach((fl) => {
        ctx.save();
        ctx.globalAlpha = fl.alpha;
        text(fl.text, sxF(fl.x), syF(fl.y), { size: 22, align: "center", bold: true, color: fl.color });
        ctx.restore();
      });

      // --- HUD QUÁN TỐI ---
      if (art) {
        const hg = ctx.createLinearGradient(0, 0, 0, 136);
        hg.addColorStop(0, highContrast ? "rgba(0,0,0,0.95)" : "rgba(6,16,28,0.8)");
        hg.addColorStop(1, "rgba(6,16,28,0.25)");
        ctx.fillStyle = hg; ctx.fillRect(0, 0, w, 136);
      }
      const tLeft = snap.time_left_ticks;
      const tUrgent = tLeft !== undefined && tLeft <= 30 * 60;
      text("⏱ Ca tối: " + fmtTime(tLeft), 16, 30, { size: 24, bold: true, color: tUrgent ? "#ff5252" : "#e8eef2" });

      const se = snap.shift_earned !== undefined ? snap.shift_earned : snap.earned;
      text("💰 Doanh thu ca: " + dash(se !== undefined && se !== null ? se + "k" : null), 200, 30, { size: 20, color: "#ffe082", bold: true });
      text("Tổng tiền: " + dash(snap.money !== undefined ? snap.money + "k" : null), 430, 30, { size: 20, color: "#a5d6a7" });

      const rep = snap.reputation;
      text("⭐ Uy tín: " + (rep !== undefined && rep !== null ? Number(rep).toFixed(1) : "—"), 630, 30, { size: 20, color: "#ffd54f", bold: true });

      const handLbl = dishOf(snap.hand);
      text("Đang bưng: " + (handLbl ? shortDish(handLbl) : "(trống)"), w - 16, 30, { size: 20, align: "right", color: handLbl ? "#ffcc80" : "#90a4ae" });

      // Tình trạng 4 bàn T1..T4 (+ badge TV3 khi sắp giận)
      const tableIds = ["T1", "T2", "T3", "T4"];
      const tw = Math.min(200, (w - 40) / 4 - 10);
      UI.r.top = { x: 8, y: 4, w: w - 16, h: 36 };
      UI.r.tables = { x: 10, y: 42, w: 4 * (tw + 10) + 2, h: 82 };
      tableIds.forEach((tid, i) => {
        const c = byTable[tid];
        const x0 = 16 + i * (tw + 10);
        panel(x0, 44, tw, 76);
        text(tid, x0 + 10, 68, { size: 18, bold: true, color: "#81d4fa" });
        if (!c) text("Bàn trống", x0 + 10, 96, { size: 18, color: "#78909c" });
        else {
          const cd = dishOf(c);
          text(cd ? shortDish(cd) : "Đang chờ…", x0 + 10, 94, { size: 18, color: "#ffffff" });
          const pl = patienceLeft(c), pm = patienceMax(c, meta);
          if (c.state === "eating") text("Đang thưởng thức 😋", x0 + 10, 114, { size: 18, color: "#69f0ae" });
          else if (pl !== undefined && pm > 0) {
            const low = pl / pm < 0.25;
            bar(x0 + 8, 98, tw - 16, 12, pl / pm, low ? "#ff1744" : "#ffca28");
            if (low) angryBadge(x0 + tw - 32, 44, false);
          } else text("KN —", x0 + 10, 114, { size: 18, color: "#78909c" });
        }
      });

      // Kho hàng & cảnh báo khách giận
      const usable = stockCounts(true), allSt = stockItems();
      let stockLine = "—";
      if (allSt.length) {
        const parts = Object.keys(usable).map((k) => (KIND_NAME[k] || k) + "×" + usable[k]);
        const spoiledN = allSt.filter((it) => !isUsableItem(it)).length;
        stockLine = (parts.length ? parts.join(", ") : "(hết hàng tươi)") + (spoiledN ? " · ươn×" + spoiledN : "");
      }
      text("Kho nguyên liệu: " + stockLine, 16, 160, { size: 18, color: "#b0bec5" });
      const spoiledSlots = allSt.filter((it) => !isUsableItem(it)).slice(0, 4);
      spoiledSlots.forEach((it, i) => drawFreshSlot(16 + i * 52, 172, 44, it, false));
      const qev = lastHudEvent(QUAN_HUD_EVENTS);
      if (qev) text(hudEventLine(qev), w - 16, 74, { size: 18, align: "right", color: "#ffe082" });

      const angry = (snap.customers || []).some((c) => {
        if (c.state === "eating") return false;
        const pl = patienceLeft(c), pm = patienceMax(c, meta);
        return pl !== undefined && pm > 0 && pl / pm < 0.25;
      });
      sfxEdgeWarn(false, angry);
      if (angry) alertBanner(w, art ? h - 112 : 200, "⚠ Khách sắp giận bỏ về!");

      drawQuanHint(w, h);
      text("WASD đi · E làm việc · ? hướng dẫn · Esc tạm dừng · M âm", w - 16, h - 18, { size: 18, align: "right", color: "#90a4ae" });
    }

    // ==========================================

    function drawMenu(w, h) {
      const artBg = ART.ok !== false && artSafe(() => artMenuFrame(ART.dt, w, h), "menu");
      if (artBg) {
        ART.drawn = true;
        ctx.clearRect(-60, -60, w + 120, h + 120);

        ctx.fillStyle = dg; ctx.fillRect(0, 0, w, h);
      } else {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#0d2b45");
      g.addColorStop(1, "#07121c");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      }

      // Hiệu ứng hạt sáng lấp lánh trên sông ở màn hình chính
      for (let i = 0; i < (artBg ? 0 : 20); i++) {
        const sx = (Math.sin(i * 99 + gameTime * 0.5) * 0.5 + 0.5) * w;

        ctx.arc(sx, sy, 3, 0, Math.PI * 2);

      text("QUÁN ĂN CHỢ NỔI", w / 2, h * 0.26, { size: 46, align: "center", bold: true, color: "#ffe082" });
      text("Sông nước Miền Tây · Trường con khởi nghiệp", w / 2, h * 0.26 + 42, { size: 22, align: "center", color: "#80deea" });

      // Bố cục menu co theo chiều cao: không đè tiêu đề, nút Đóng luôn nằm trong khung.
      const MENU_H = 296;
      const topMin = h * 0.26 + 64;

      btn("storyReplay", "📖 Cốt truyện", w / 2 + 3, oy(62), 137, bh(44), { size: 18, fill: "#4e342e", stroke: "#ffcc80" });
      btn("contrast", highContrast ? "Tương phản: BẬT" : "👁 Chế độ tương phản cao", w / 2 - 140, oy(114), 280, bh(44), {
        size: 18,
        fill: highContrast ? "#212121" : "#1e3a4c",
        stroke: highContrast ? "#ffe600" : "#4fc3f7",
        color: highContrast ? "#ffe600" : "#e1f5fe"
      });
      btn("toggleSound", soundOn ? "🔊 Âm thanh: BẬT (M)" : "🔇 Âm thanh: TẮT (M)", w / 2 - 140, oy(164), 280, bh(40), {
        size: 18, fill: soundOn ? "#1b5e20" : "#37474f", stroke: soundOn ? "#69f0ae" : "#90a4ae"

        size: 18, fill: captionsOn ? "#0d47a1" : "#37474f", stroke: captionsOn ? "#82b1ff" : "#90a4ae"

    function shopCatalog() {
      if (snap && snap.shop && typeof snap.shop === "object" && !Array.isArray(snap.shop)) {
        const keys = Object.keys(snap.shop);
        if (keys.length && snap.shop[keys[0]] && snap.shop[keys[0]].level !== undefined) return snap.shop;
      }
      const metaShop = snap && snap.meta && snap.meta.shop;
      if (metaShop && metaShop.upgrades) {
        const ups = (snap && snap.upgrades) || {};
        const out = {};
        Object.keys(metaShop.upgrades).forEach((uid) => {
          const lv = ups[uid] || 0;
          const arr = metaShop.upgrades[uid] || [];
          const nxt = arr.find((e) => e.level === lv + 1) || null;
          out[uid] = { level: lv, max_level: arr.length, next: nxt };
        });
        return out;
      }
      return DEMO ? {
        oxygen: { level: 0, max_level: 2, next: { level: 1, price: 200, oxygen_max_s: 45 } },
        hp: { level: 0, max_level: 2, next: { level: 1, price: 250, hp_max: 4 } },
      } : {};

    function upgradeTitle(uid) { return uid === "oxygen" ? "Bình oxy" : uid === "hp" ? "Áo phao" : uid; }
    function upgradeNextDesc(nxt) {
      if (!nxt) return "";
      if (nxt.oxygen_max_s) return nxt.oxygen_max_s + " s oxy";
      if (nxt.hp_max) return nxt.hp_max + " Máu";
      if (nxt.desc) return nxt.desc;
      return "cấp " + nxt.level;

    // ==========================================
    // MAIN RENDER LOOP (60-120 FPS via requestAnimationFrame)
    // ==========================================

    // ==========================================
    // PHASE 4 — HƯỚNG DẪN (tutorial) · CỐT TRUYỆN (story) · NHẠC NỀN (audio) · GỢI Ý QUÁN
    // Chỉ đọc /state; không đổi luật sim. Thiếu story.js / audio.js thì bỏ qua êm.
    // ==========================================
    const UI = { r: {}, sx: null, sy: null, S: null, dock: null };
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
    function rrectPath(x, y, w, h, r) {
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    }
    function wrapLines(s, maxW, size, bold) {
      ctx.font = (bold ? "600 " : "") + Math.max(HUD_MIN, size) + "px " + FONT;
      const out = []; let cur = "";
      String(s).split(" ").forEach((wd) => {
        const t = cur ? cur + " " + wd : wd;
        if (cur && ctx.measureText(t).width > maxW) { out.push(cur); cur = wd; } else cur = t;
      });
      if (cur) out.push(cur);
      return out;
    }

    // ---------- Nhạc nền (ChoNoiAudio) ----------
    const AUD = { inited: false, scene: "__", vol: 0.7, depth: null, inten: 0, sentInten: -1, last: 0, endBad: false };
    (function () { const v = parseFloat(lsGet("chonoi_music_vol")); if (isFinite(v)) AUD.vol = Math.max(0, Math.min(1, v)); })();
    function audCall(fn, a) {
      try { const A = window.ChoNoiAudio; if (A && typeof A[fn] === "function") return A[fn](a); } catch (e) { /* nhạc không được làm hỏng game */ }
      return undefined;
    }
    function audInit() {
      if (AUD.inited || !window.ChoNoiAudio) return;
      AUD.inited = true;
      audCall("init"); audCall("setVolume", AUD.vol); audCall("setMuted", !soundOn);
      AUD.scene = "__"; AUD.depth = null; AUD.sentInten = -1;
    }
    function setMusicVol(v) {
      AUD.vol = Math.max(0, Math.min(1, Math.round(v * 10) / 10));
      lsSet("chonoi_music_vol", String(AUD.vol));
      audCall("setVolume", AUD.vol);
    }
    function audDesiredScene() {
      if (storyActive()) return "story";
      if (uiScreen === "menu") return "menu";
      if (uiScreen === "dayIntro") return "story";
      if (uiScreen === "eveningIntro") return "quan";
      if (uiScreen === "dayResult") return "result";
      if (uiScreen === "summary") return AUD.endBad ? "result_sad" : "result";
      if (uiScreen === "shop") return "shop";
      const ph = snap ? (simPhase() || snap.mode) : null;
      return ph === "quan" ? "quan" : "dive";
    }
    function audIntensityTarget() {
      if (!snap || uiScreen !== "play" || paused) return 0;
      const ph = simPhase() || snap.mode;
      const meta = snap.meta || {};
      if (ph === "quan") {
        let angry = 0, n = 0;
        (snap.customers || []).forEach((c) => {

      if (!s.hold && TUT.track === "quan" && !Object.keys(stockCounts(true)).length) text("Kho đang trống nên chưa có khách. Bấm \"Bỏ bước\" để đi tiếp.", cx0 + 20, cy0 + ch - 58, { size: 18, color: "#ef9a9a" });
      const by = cy0 + ch - 48;
      btn("tutNext", s.last ? "Đã hiểu ✔" : (s.hold ? "Tiếp ▶ (Enter)" : "Bỏ bước ▶"), cx0 + 20, by, 190, 38, { size: 18 });
      btn("tutSkip", "Bỏ qua hướng dẫn (Esc)", cx0 + 222, by, 270, 38, { size: 18, fill: "#3e2723", stroke: "#ef5350" });
    }
    function wantHold() {
      return !(uiScreen === "play" || uiScreen === "shop") || storyActive() || tutHolding();
    }
    let lastHoldFix = 0;
    function syncHold(now) {
      if (DEMO) return;
      const want = wantHold();
      if (snap && snap.held !== undefined && snap.held !== want && now - lastHoldFix > 300) { lastHoldFix = now; holdSent = null; }
      sendHold(want);
    }
    const MODAL_OK = new Set(["tutNext", "tutSkip", "storyNext", "storySkip", "toggleSound", "toggleCaptions", "help"]);

    function frame() {
      requestAnimationFrame(frame);
      const now = performance.now();
      const dt = Math.min(0.1, (now - lastFrame) / 1000);
      lastFrame = now;
      gameTime += dt;
      if (dt > 0) fpsEMA = fpsEMA * 0.92 + (1 / dt) * 0.08;

      updateParticles(dt);
      ART.dt = paused ? 0 : dt;
      ART.drawn = false;
      buttons = [];
      UI.r = {};
      const [w, h] = fit();

      ctx.save();
      // Áp dụng rung màn hình (Screen Shake)
      if (lerpState.screenShake.intensity > 0) {
        ctx.translate(lerpState.screenShake.x, lerpState.screenShake.y);
      }

      ctx.fillStyle = "#0c141c";
      ctx.fillRect(0, 0, w, h);

      if (uiScreen === "menu") drawMenu(w, h);
      else if (uiScreen === "dayIntro") drawDayIntro(w, h);
      else if (uiScreen === "eveningIntro") drawEveningIntro(w, h);
      else if (uiScreen === "dayResult") drawDayResult(w, h);
      else if (uiScreen === "shop") {
        drawShop(w, h);
        if (paused) drawPause(w, h);
      }
      else if (uiScreen === "summary") drawSummary(w, h);
      else if (uiScreen === "play" || DEMO === "pause") {
        if (DEMO === "pause" && !snap) {
          text("(demo pause — mở kèm live để thấy nền game)", w / 2, h / 2 - 160, { align: "center", size: 18, color: "#78909c" });
        } else if (!snap) {
          text(offline ? "Không có kết nối…" : "Đang tải dữ liệu…", w / 2, h / 2, { align: "center", size: 24 });
        } else {
          if ((simPhase() || snap.mode) === "quan") drawQuan(w, h);
          else drawGather(w, h);
          eventLog(w, h);
          overlay(w, h);
        }
        if (paused || DEMO === "pause") drawPause(w, h);
      }

      ctx.restore();

      // Art layer: vẽ PixiJS (nền) khi màn hiện tại có cảnh art; ngược lại ẩn để canvas 2D tự vẽ
      if (ART.view) {
        let ok = false;
        if (ART.drawn && ART.ok !== false && ART.stage) {
          ok = !!artSafe(() => {
            ART.stage.x = lerpState.screenShake.x; ART.stage.y = lerpState.screenShake.y;
            ART.app.renderer.render(ART.stage);
            return true;
          }, "render");
        }
        ART.view.style.display = ok ? "block" : "none";
      }

      // Hướng dẫn / cốt truyện / nhạc (ngoài screen-shake)
      tutMaybeStart(); tutUpdate(now);
      drawTutorial(w, h);
      drawStory(w, h);
      syncHold(now);
      audSync(now);

      // SFX toggles + phụ đề (ngoài screen-shake)
      drawSfxHudToggles(w, h);
      drawSfxCaptions(w, h);

      // Chỉ số FPS góc màn hình cho Phase 4 Benchmark
      text(Math.round(fpsEMA) + " FPS", 10, h - 18, { size: 18, color: highContrast ? "#ffe600" : "rgba(255,255,255,0.4)" });
      applyContrastFrame(w, h);
    }
    requestAnimationFrame(frame);

    // Xử lý các chế độ Demo đặc biệt
    if (DEMO === "pause") { uiScreen = "play"; paused = true; }
    else if (DEMO === "fresh") applyFreshDemo();
    else if (DEMO === "warn") {
      uiScreen = "play";
      highContrast = true;
      snap = {
        mode: "gather", tick: 40, time_left_ticks: 9000, hold_capacity: 12, hold: [],
        player: { pos: [20, 12], oxygen_ticks: 200, oxygen_max_ticks: 1800, hp: 2, hp_max: 3, at_surface: false },
        nodes: [], fish: [],
        monsters: [{ id: "M1", pos: [22, 12], warn_radius: 10 }],
        events: [],
        meta: { bounds: { x: [0, 100], d: [0, 30] }, dock_pos: [2, 0], dock_radius: 3 },
      };
    } else if (DEMO === "warnq") {
      uiScreen = "play";
      highContrast = true;
      snap = {
        mode: "quan", tick: 80, time_left_ticks: 4000, money: 100, earned: 40, reputation: 3, hand: null,
        player: { pos: [4, 4] }, stock: {}, stoves: [{ id: "B1", pos: [2, 8], state: "idle" }],
        tables: [{ id: "T1", pos: [9, 2] }],
        customers: [{ id: "C1", table_id: "T1", state: "waiting", dish_id: "lau_mam", patience_ticks_left: 400, patience_max_ticks: 3600 }],
        events: [],
        meta: { bounds: { x: [0, 16], z: [0, 10] }, patience_s: 60 },
      };
    } else if (DEMO === "sfx") {
      soundOn = false; // kiểm phụ đề với âm tắt (không ghi đè localStorage)
      captionsOn = true;
      startSfxDemo();
    } else if (DEMO) setScreen(DEMO);
  </script>
</body>

</html>
